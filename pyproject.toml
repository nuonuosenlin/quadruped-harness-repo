[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-visual-harness-demo"
version = "0.1.0"
description = "A simulation-only Go2 visual tool-calling harness"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco==3.2.5",
    "numpy>=1.24,<2",
    "torch>=2.2,<3",
    "opencv-python>=4.8,<4.12",
    "Pillow>=10,<12",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
go2-demo = "go2_demo.__main__:main"

[tool.setuptools.packages.find]
include = ["go2_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dataset: regression tests using downloaded, checksum-verified QUARD samples"]
